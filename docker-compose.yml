name: opspulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspulse}
      POSTGRES_DB: opspulse
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      OPSPULSE_ENV: ${OPSPULSE_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://opspulse:${POSTGRES_PASSWORD:-opspulse}@postgres:5432/opspulse?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-http://localhost:3000/v1/auth/github/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # The public origin GitHub delivers webhooks to — the dashboard,
      # which proxies /v1/* to this service. A tunnel URL locally.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # The API applies pending migrations on startup, so this is the only
      # place schema changes are applied — locally and in production alike.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # Server-side calls travel over the compose network, not localhost.
      # Server-side only. The browser never talks to the API directly: the
      # dashboard proxies /v1/* to it, which keeps one origin so the session
      # cookie works without a shared parent domain.
      OPSPULSE_API_URL: http://api:8080
      OPSPULSE_API_TOKEN: ${OPSPULSE_API_TOKEN:-}
      OPSPULSE_PROJECT_ID: ${OPSPULSE_PROJECT_ID:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
