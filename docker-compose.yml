name: opspulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspulse}
      POSTGRES_DB: opspulse
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mounted outside the init directory so only the .up.sql files run;
      # init-db.sh applies them in filename order on first start.
      - ./infra/migrations:/migrations:ro
      - ./infra/docker/init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      OPSPULSE_ENV: ${OPSPULSE_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://opspulse:${POSTGRES_PASSWORD:-opspulse}@postgres:5432/opspulse?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # Server-side calls travel over the compose network, not localhost.
      OPSPULSE_API_URL: http://api:8080
      OPSPULSE_API_TOKEN: ${OPSPULSE_API_TOKEN:-}
      OPSPULSE_PROJECT_ID: ${OPSPULSE_PROJECT_ID:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
